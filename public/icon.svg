<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Building Silhouettes -->
    <rect x="110" y="190" width="130" height="230" rx="12" fill="#ffffff" />
    <rect x="260" y="120" width="142" height="300" rx="12" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Windows for left building -->
    <rect x="135" y="220" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="180" y="220" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="135" y="265" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="180" y="265" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="135" y="310" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="180" y="310" width="24" height="24" rx="4" fill="#3b82f6" />
    <rect x="155" y="365" width="38" height="55" rx="4" fill="#1e3a8a" />
    
    <!-- Windows for tower -->
    <rect x="285" y="150" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="345" y="150" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="285" y="195" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="345" y="195" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="285" y="240" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="345" y="240" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="285" y="285" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="345" y="285" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="285" y="330" width="26" height="26" rx="4" fill="#2563eb" />
    <rect x="345" y="330" width="26" height="26" rx="4" fill="#2563eb" />
  </g>
  <!-- Security / Key Badge Icon in gold -->
  <circle cx="380" cy="110" r="44" fill="#f59e0b" />
  <path d="M370 100 L390 100 A10 10 0 1 1 370 100 Z" fill="#ffffff" />
