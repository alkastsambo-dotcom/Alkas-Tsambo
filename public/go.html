<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection vers LocatifPro...</title>
    <link rel="icon" type="image/jpeg" href="/assets/aistudio/1794661876158_210f17d4.jpg" />
    <meta
      http-equiv="refresh"
      content="1;url=/?from=redirect"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #102a3b, #07111a 70%);
        color: #f8fafc;
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 28px 24px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(217, 158, 68, 0.35);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: cover;
        border: 2px solid rgba(217, 158, 68, 0.7);
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 800;
      }
      p {
        margin: 0 0 18px;
        font-size: 13px;
        color: #cbd5e1;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        background: #1b5e6f;
        color: #ffffff;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
      }
      .btn:hover {
        background: #144754;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="/assets/aistudio/1794661876158_210f17d4.jpg"
        alt="LocatifPro"
        class="logo"
      />
      <h1>LocatifPro</h1>
      <p>Redirection sécurisée vers votre espace de gestion locative &amp; hôtelière...</p>
      <a id="target-link" href="/" class="btn">Accéder maintenant à LocatifPro</a>
    </div>
    <script>
      (function () {
        var qs = window.location.search || '';
        var target = '/' + qs;
        var linkEl = document.getElementById('target-link');
        if (linkEl) linkEl.setAttribute('href', target);
        setTimeout(function () {
          window.location.replace(target);
        }, 450);
      })();
    </script>
  </body>
</html>
